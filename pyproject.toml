[project]
name = "clage"
version = "0.3.0"
description = "From-scratch NEAT neuroevolution engine and 2D artificial-life simulation"
authors = [
    {name = "Utkarsh Sonawane"}
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "matplotlib>=3.0"
]

[project.optional-dependencies]
studio = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.0",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
python_files = "test_*.py"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.mypy]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["neat", "world", "experiments", "diversity", "visual", "benchmarks", "studio"]
exclude = ["tests*"]

[tool.setuptools.package-data]
studio = ["static/*"]
